<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda Mexa - Productos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Imagenes de productos */
    .card-img-top {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Carrito */
    .cart-btn {
      background: #2962ff;
      color: white;
      font-weight: bold;
      border-radius: 50px;
      padding: 6px 18px;
    }
    .cart-btn:hover {
      background: #003cbd;
      color: white;
    }
  </style>
</head>

<body style="background-color:#ffffff;">

<!-- ======================= HEADER ======================= -->
<header class="py-2 px-3 d-flex align-items-center justify-content-between" style="background:#d7e6ff;">

  <!-- LOGO -->
  <div class="d-flex align-items-center">
      <img src="logo.jpg" alt="Logo" width="50" height="50" class="me-2">
      <div class="text-center">
          <h4 class="m-0 fw-bold">Tienda Mexa</h4>
          <small class="text-primary">Lo que necesitas, siempre contigo</small>
      </div>
  </div>

  <!-- MENÚ + CARRITO -->
  <div class="d-flex align-items-center gap-4">

      <a href="login.html" class="text-primary fw-semibold">Inicio de sesión</a>

      <a href="index.html" class="text-primary fw-semibold">Inicio</a>

      <input type="text" placeholder="Buscar productos..." class="form-control-sm rounded-pill px-3">

      <button class="btn btn-outline-secondary btn-sm">Buscar</button>

      <!-- BOTÓN DEL CARRITO -->
      <button class="cart-btn position-relative" data-bs-toggle="offcanvas" data-bs-target="#carritoCanvas">
        🛒 Carrito
        <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          0
        </span>
      </button>

  </div>
</header>



<!-- ======================= CONTENIDO ======================= -->
<div class="container my-4">
  <h2>Productos</h2>

  <div class="row g-3" id="productsList">

      <!-- ‼️ AQUI PEGAS TUS TARJETAS DE PRODUCTOS COMO SIEMPRE -->
      <!-- ejemplo:
      <div class="col-6 col-md-4">
        <div class="card product-item p-2" data-id="ver-lechuga" data-name="Lechuga" data-price="12.00">
          <img src="lechuga.jpg" class="card-img-top">
          <div class="card-body text-center">
            <h6 class="card-title">Lechuga</h6>
            <p class="card-text small">$12.00</p>
            <button class="btn btn-success btn-add">Agregar</button>
          </div>
        </div>
      </div>
      -->

  </div>
</div>



<!-- ======================= PANEL DEL CARRITO ======================= -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="carritoCanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">🛒 Tu carrito</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">

    <ul id="cartItems" class="list-group mb-3"></ul>

    <h5>Total: $<span id="cartTotal">0.00</span></h5>

    <button class="btn btn-success w-100 mt-3">Finalizar compra</button>
  </div>
</div>



<!-- ======================= SCRIPT DEL CARRITO ======================= -->
<script>
let cart = [];
let total = 0;

// Detecta todos los botones "Agregar"
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("btn-add")) {

    const card = e.target.closest(".product-item");
    const name = card.dataset.name;
    const price = parseFloat(card.dataset.price);

    cart.push({ name, price });
    total += price;

    updateCartUI();
  }
});

function updateCartUI() {
  const cartList = document.getElementById("cartItems");
  const cartCount = document.getElementById("cartCount");
  const cartTotal = document.getElementById("cartTotal");

  cartList.innerHTML = "";

  cart.forEach(item => {
    const li = document.createElement("li");
    li.classList.add("list-group-item", "d-flex", "justify-content-between");

    li.innerHTML = `
      ${item.name} 
      <span>$${item.price.toFixed(2)}</span>
    `;

    cartList.appendChild(li);
  });

  cartCount.textContent = cart.length;
  cartTotal.textContent = total.toFixed(2);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
