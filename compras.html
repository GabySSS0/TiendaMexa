<div class="offcanvas offcanvas-end" tabindex="-1" id="carritoCanvas">

    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

    <ul id="cartItems" class="list-group mb-3"></ul>

    <h5>Total: $<span id="cartTotal">0.00</span></h5>

      Finalizar compra
    </button>

<!-- ======================= SCRIPT DEL CARRITO ======================= -->
<script>
let cart = [];
let total = 0;

// Detecta todos los botones "Agregar"
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("btn-add")) {

    const card = e.target.closest(".product-item");
    const name = card.dataset.name;
    const price = parseFloat(card.dataset.price);

    cart.push({ name, price });
    total += price;

    updateCartUI();
  }
});

function updateCartUI() {
  const cartList = document.getElementById("cartItems");
  const cartCount = document.getElementById("cartCount");
  const cartTotal = document.getElementById("cartTotal");

  cartList.innerHTML = "";

  cart.forEach(item => {
    const li = document.createElement("li");
    li.classList.add("list-group-item", "d-flex", "justify-content-between");

    li.innerHTML = `
      ${item.name} 
      <span>$${item.price.toFixed(2)}</span>
    `;

    cartList.appendChild(li);
  });

  cartCount.textContent = cart.length;
  cartTotal.textContent = total.toFixed(2);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<section class="container my-5">
  <h2 class="mb-4">🛒 Tu carrito</h2>

  <div id="cart-items"></div>

  <h4 class="mt-4">
    Total: $<span id="cart-total">0</span>
  </h4>

  <button id="clear-cart" class="btn btn-danger mt-3">
    Vaciar carrito
  </button>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");
  const cartCount = document.getElementById("cartCount");

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  // 👉 AGREGAR PRODUCTO
  document.addEventListener("click", e => {
    if (e.target.classList.contains("btn-add")) {
      const card = e.target.closest(".product-item");
      const id = card.dataset.id;
      const name = card.dataset.name;
      const price = parseFloat(card.dataset.price);

      const existing = cart.find(p => p.id === id);

      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ id, name, price, quantity: 1 });
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }
  });

  // 👉 RENDER CARRITO LATERAL
  function renderCart() {
    cartItems.innerHTML = "";
    let total = 0;
    let count = 0;

    if (cart.length === 0) {
      cartItems.innerHTML = `<li class="list-group-item text-center">Carrito vacío 🛒</li>`;
    }

    cart.forEach((item, index) => {
      total += item.price * item.quantity;
      count += item.quantity;

      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";

      li.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          <small>Cantidad: ${item.quantity}</small>
        </div>
        <span>$${(item.price * item.quantity).toFixed(2)}</span>
      `;

      cartItems.appendChild(li);
    });

    cartTotal.textContent = total.toFixed(2);
    cartCount.textContent = count;
  }

  renderCart();
});
</script>
