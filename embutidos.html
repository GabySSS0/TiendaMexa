<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embutidos - Tienda Mexa</title>
  <link href="assets/css/styles.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
.card-img-top {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}
</style>

</head>

<header class="py-2 px-3 d-flex align-items-center justify-content-between" style="background:#d7e6ff;">
      
      <!-- LOGO -->
      <div class="d-flex align-items-center">
        <img src="logo.jpg" alt="Logo" width="50" height="50" class="me-2">
        <div class="text-center">
          <h4 class="m-0 fw-bold">Tienda Mexa</h4>
          <small class="text-primary">Lo que necesitas, siempre contigo</small>
        </div>
      </div>

      <!-- ENLACES DE NAVEGACIÓN -->
      <div class="d-flex align-items-center gap-4">

        <a href="login.html" class="text-primary fw-semibold">Inicio de sesión</a>

        <a href="index.html" class="text-primary fw-semibold">Inicio</a>

        <input type="text" placeholder="Buscar productos..." class="form-control-sm rounded-pill px-3">
        <button class="btn btn-outline-secondary btn-sm">Buscar</button>

        <button class="btn btn-outline-secondary btn-sm">🛒</button>

      </div>
  </header>

<body style="background-color:#ffffff;">

  <div class="container my-4">
    
    <h2>Embutidos</h2>
    <div class="row g-3" id="productsList">

  <!-- Jamón -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="emb-jamon" data-name="Jamón de Pavo" data-price="42.00">
      <img src="jamon.jpg" class="card-img-top" alt="Jamón de pavo">
      <div class="card-body text-center">
        <h6 class="card-title">Jamón de pavo</h6>
        <p class="card-text small">$42.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Salchichas -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="emb-salchicha" data-name="Salchichas Viena" data-price="28.00">
      <img src="salchicha.jpg" class="card-img-top" alt="Salchichas">
      <div class="card-body text-center">
        <h6 class="card-title">Salchichas Viena</h6>
        <p class="card-text small">$28.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mortadela -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="emb-mortadela" data-name="Mortadela de cerdo" data-price="24.00">
      <img src="mortadela.jpg" class="card-img-top" alt="Mortadela">
      <div class="card-body text-center">
        <h6 class="card-title">Mortadela de cerdo</h6>
        <p class="card-text small">$24.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Chorizo -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="emb-chorizo" data-name="Chorizo casero" data-price="35.00">
      <img src="chorizo.jpg" class="card-img-top" alt="Chorizo">
      <div class="card-body text-center">
        <h6 class="card-title">Chorizo casero</h6>
        <p class="card-text small">$35.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tocino -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="emb-tocino" data-name="Tocino ahumado" data-price="48.00">
      <img src="tocino.jpg" class="card-img-top" alt="Tocino">
      <div class="card-body text-center">
        <h6 class="card-title">Tocino ahumado</h6>
        <p class="card-text small">$48.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Salami -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="emb-salami" data-name="Salami rebanado" data-price="40.00">
      <img src="salami.jpg" class="card-img-top" alt="Salami">
      <div class="card-body text-center">
        <h6 class="card-title">Salami rebanado</h6>
        <p class="card-text small">$40.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

    </div>
  </div>

  <script src="assets/js/cart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
