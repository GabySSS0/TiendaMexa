<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesión</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #06c5d38e, #189c9c94);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      width: 380px;
      padding: 30px;
      transition: all 0.3s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1ae7e7;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #1ae7e7;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #cba011;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #1ae7e7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1a5edb;
    }

    .toggle-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #2575fc;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .toggle-link:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .main-box{
  background: white;
  width: 700px;
  height: 420px;
  display: flex;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

/* Mitad formulario */
.form-side{
  width: 50%;
  padding: 30px;
}

/* Mitad logo */
.logo-side{
  width: 50%;
  background: #fffff6;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-side img{
  max-width: 80%;
  height: auto;
}
.main-box{
  position: relative; /* necesario */
}

/* Línea divisoria */
.main-box::after{
  content: "";
  position: absolute;
  top: 10%;
  bottom: 10%;
  left: 50%;
  width: 1px;
  background: rgba(0,0,0,0.15);
}


@media(max-width:768px){
  .main-box{
    flex-direction: column;
    width: 90%;
    height: auto;
  }

  .form-side,
  .logo-side{
    width: 100%;
  }

  .logo-side{
    padding: 20px;
  }
  @media(max-width:768px){
  .main-box::after{
    display: none;
  }
}

}

  </style>
</head>
<body>
  <div class="main-box">

  <!-- FORMULARIOS -->
  <div class="form-side">
    <form id="login-form">
      <h2>Iniciar Sesión</h2>

      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" required>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" required>
      </div>

      <button class="btn">Ingresar</button>
      <a class="toggle-link" id="show-register">¿No tienes cuenta? Crear una</a>
    </form>

    <form id="register-form" class="hidden">
      <h2>Crear Cuenta</h2>

      <div class="input-group">
        <label>Nombre completo</label>
        <input type="text" required>
      </div>

      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" required>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" required>
      </div>

      <button class="btn">Crear cuenta</button>
      <a class="toggle-link" id="show-login">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>


  <!-- LOGO -->
  <div class="logo-side">
    <img src="logo.jpg" alt="Logo">
  </div>

</div>

  </script>

  <script>
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const showRegister = document.getElementById('show-register');
  const showLogin = document.getElementById('show-login');

  showRegister.onclick = () => {
    loginForm.classList.add('hidden');
    registerForm.classList.remove('hidden');
  };

  showLogin.onclick = () => {
    registerForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
  };

  loginForm.onsubmit = (e) => {
    e.preventDefault();
    alert('Inicio de sesión exitoso (ejemplo)');
  };

  registerForm.onsubmit = (e) => {
    e.preventDefault();
    alert('Cuenta creada exitosamente (ejemplo)');
  };
</script>

</body>
</html>
