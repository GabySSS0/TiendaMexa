<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesión</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      width: 380px;
      padding: 30px;
      transition: all 0.3s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #2575fc;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #2575fc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1a5edb;
    }

    .toggle-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #2575fc;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .toggle-link:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="login-container">
    <form id="login-form">
      <h2>Iniciar Sesión</h2>
      <div class="input-group">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" placeholder="usuario@ejemplo.com" required />
      </div>
      <div class="input-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn">Ingresar</button>
      <a class="toggle-link" id="show-register">¿No tienes cuenta? Crear una</a>
    </form>

    <form id="register-form" class="hidden">
      <h2>Crear Cuenta</h2>
      <div class="input-group">
        <label for="register-name">Nombre completo</label>
        <input type="text" id="register-name" placeholder="Tu nombre" required />
      </div>
      <div class="input-group">
        <label for="register-email">Correo electrónico</label>
        <input type="email" id="register-email" placeholder="usuario@ejemplo.com" required />
      </div>
      <div class="input-group">
        <label for="register-password">Contraseña</label>
        <input type="password" id="register-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn">Crear cuenta</button>
      <a class="toggle-link" id="show-login">¿Ya tienes cuenta? Inicia sesión</a>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const showRegister = document.getElementById('show-register');
    const showLogin = document.getElementById('show-login');

    showRegister.addEventListener('click', () => {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
    });

    showLogin.addEventListener('click', () => {
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Inicio de sesión exitoso (ejemplo)');
    });

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Cuenta creada exitosamente (ejemplo)');
    });
  </script>
</body>
</html>
