<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Refrescos - Tienda Mexa</title>
  <link href="assets/css/styles.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
.card-img-top {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}
</style>

</head>

<header class="py-2 px-3 d-flex align-items-center justify-content-between" style="background:#d7e6ff;">
      
      <!-- LOGO -->
      <div class="d-flex align-items-center">
        <img src="logo.jpg" alt="Logo" width="50" height="50" class="me-2">
        <div class="text-center">
          <h4 class="m-0 fw-bold">Tienda Mexa</h4>
          <small class="text-primary">Lo que necesitas, siempre contigo</small>
        </div>
      </div>

      <!-- ENLACES DE NAVEGACIÓN -->
      <div class="d-flex align-items-center gap-4">

        <a href="login.html" class="text-primary fw-semibold">Inicio de sesión</a>

        <a href="index.html" class="text-primary fw-semibold">Inicio</a>

        <input type="text" placeholder="Buscar productos..." class="form-control-sm rounded-pill px-3">
        <button class="btn btn-outline-secondary btn-sm">Buscar</button>

        <button class="btn btn-outline-secondary btn-sm">🛒</button>

      </div>
  </header>

<body style="background-color:#ffffff;">

  <div class="container my-4">
    
    <h2>Refrescos</h2>
    <div class="row g-3" id="productsList">

  <!-- Red Cola -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="ref-redcola" data-name="Red Cola 2L" data-price="22.00">
      <img src="redcola.jpg" class="card-img-top" alt="Red Cola 2L">
      <div class="card-body text-center">
        <h6 class="card-title">Red Cola 2L</h6>
        <p class="card-text small">$22.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sprite -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="ref-sprite" data-name="Sprite 2L" data-price="32.00">
      <img src="sprite.jpg" class="card-img-top" alt="Sprite 2L">
      <div class="card-body text-center">
        <h6 class="card-title">Sprite 2L</h6>
        <p class="card-text small">$32.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidral Mundet -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="ref-mundet" data-name="Sidral Mundet 2L" data-price="30.00">
      <img src="sidralmundet.jpg" class="card-img-top" alt="Sidral Mundet 2L">
      <div class="card-body text-center">
        <h6 class="card-title">Sidral Mundet 2L</h6>
        <p class="card-text small">$30.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Fresca -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="ref-fresca" data-name="Fresca 2L" data-price="28.00">
      <img src="fresca.jpg" class="card-img-top" alt="Fresca 2L">
      <div class="card-body text-center">
        <h6 class="card-title">Fresca 2L</h6>
        <p class="card-text small">$28.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Jarritos -->
  <div class="col-6 col-md-4">
    <div class="card product-item p-2" data-id="ref-jarritos" data-name="Jarritos sabores 600ml" data-price="18.00">
      <img src="jarritos.jpg" class="card-img-top" alt="Jarritos sabores">
      <div class="card-body text-center">
        <h6 class="card-title">Jarritos sabores</h6>
        <p class="card-text small">$18.00</p>
        <div class="d-flex justify-content-center gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-secondary btn-decrease">−</button>
          <div class="quantity">0</div>
          <button class="btn btn-sm btn-outline-primary btn-increase">+</button>
          <button class="btn btn-sm btn-success ms-2 btn-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

    </div>
  </div>

  <script src="assets/js/cart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
